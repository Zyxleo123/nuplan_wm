diffusion_planner_es:
  _target_: diffusion_es.planner.ESRepairDiffusionPlanner
  _convert_: "all"

  config:
    _target_: diffusion_planner.utils.config.Config
    _convert_: "all"

    args_file: ???

    guidance_fn: null
  ckpt_path: ???

  past_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 20
    time_horizon: 2

  future_trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: "all"

    num_poses: 80
    time_horizon: 8

  device: cuda

  # diffusion_es: population -> repair -> AnchorWM scorer -> elites re-noised (diffusion_es/es.py)
  anchor_ckpt: ???          # anchor_wm.train checkpoint with a trained scorer (also the `anchor` forecast)
  es:                       # diffusion_es.es.ESConfig (waymax_rs run_simulation defaults)
    population: 64
    elites: 8
    iterations: 4           # re-noise rounds after the first population; 0 = best of `population` samples
    resample_t: 0.1         # diffusion time the elites are re-noised to (VP linear; 1 = pure noise)
    resample_steps: 3       # DPM-Solver steps back from resample_t
    noise_scale: 0.5        # Diffusion Planner's prior temperature
    sample_steps: 10
  enable_repair: true       # false: ES + scorer on the raw samples
  neighbor_forecast: anchor # the repair's forecast: cv | dp | anchor | none
  repair_device: cuda       # the repair runs on the whole population every round
  object_radius_m: 60.0
  repair: {}                # RepairConfig overrides
  stats_dir: null           # one JSON line per replan, one file per scenario
  seed: 0                   # per-replan sampling seed; null = unseeded
